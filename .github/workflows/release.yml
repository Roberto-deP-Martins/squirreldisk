name: Publicar Release Multiplataforma

# Esto se ejecuta solo cuando empujas un "Tag" que empiece con "v" (ej: v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows-linux:
    permissions:
      contents: write # Permiso para que GitHub cree el Release
    
    # Estrategia: Compilar en varios sistemas al mismo tiempo
    strategy:
      fail-fast: false # ¡CLAVE! Si macOS falla, Windows y Linux siguen subiendo.
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles msi'
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Rust (estable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }} # Si es Mac, instala el compilador extra

      - name: Preparar cache de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependencias (Solo Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Compilar y Empaquetar Tauri
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        continue-on-error: true # ¡CLAVE! Si falla, no mata el proceso, pasa al siguiente paso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Versión ${{ github.ref_name }}'
          releaseBody: 'Automáticamente generada. Revisa los logs de macOS si fallaron.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-macos:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          
    runs-on: macos-latest 
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*' # Use your preferred Node version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri (Solo App)
        run: pnpm tauri build --bundles app --target ${{ matrix.target }}

      - name: Ad-hoc sign macOS App
        run: codesign --force --deep --sign - "src-tauri/target/${{ matrix.target }}/release/bundle/macos/SQDisk.app"

      - name: Zip macOS App
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos/
          zip -r SQDisk-macOS-${{ matrix.target }}.zip SQDisk.app

      - name: Deploy macOS Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/${{ matrix.target }}/release/bundle/macos/SQDisk-macOS-${{ matrix.target }}.zip
